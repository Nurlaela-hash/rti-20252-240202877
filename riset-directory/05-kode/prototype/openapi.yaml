openapi: 3.0.3
info:
  title: CRUD Kompleks Benchmark API
  version: 1.0.0
  description: Kontrak API bersama untuk perbandingan Laravel dan Express.js.
servers:
  - url: http://localhost:3000
    description: Express.js
  - url: http://localhost:8000
    description: Laravel scaffold
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /api/products:
    get:
      summary: List products with joins, filters, and pagination
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: perPage
          schema:
            type: integer
            default: 20
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: integer
        - in: query
          name: brandId
          schema:
            type: integer
        - in: query
          name: minPrice
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
      responses:
        '200':
          description: Paginated product list
    post:
      summary: Create product
      responses:
        '201':
          description: Created
  /api/products/{id}:
    get:
      summary: Show product detail
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product detail
    put:
      summary: Update product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Updated
    delete:
      summary: Delete product
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
