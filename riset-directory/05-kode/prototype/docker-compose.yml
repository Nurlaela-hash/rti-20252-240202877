services:
  mysql:
    image: mysql:5.7
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: benchmark_rti
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  express:
    build:
      context: ./service-express
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: benchmark_rti
      APP_PORT: 3000
    ports:
      - "3000:3000"

  laravel:
    build:
      context: ./service-laravel
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: benchmark_rti
      APP_PORT: 8000
    ports:
      - "8000:8000"

volumes:
  mysql_data:
